<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .p5  { stroke:#c0392b; stroke-width:2.4; fill:none; }
    .gnd { stroke:#2563b0; stroke-width:2.4; fill:none; }
    .sig { stroke:#e67e22; stroke-width:2.4; fill:none; }
    .part{ stroke:#1f2328; stroke-width:2; fill:#fff; }
    .ln  { stroke:#1f2328; stroke-width:2; fill:none; }
    .ref { font-size:15px; font-weight:bold; fill:#1f2328; }
    .val { font-size:13px; fill:#1f2328; }
    .pin { font-size:13px; fill:#1f2328; }
    .pnr { font-size:11px; fill:#6e7781; }
    .net { font-size:14px; font-weight:bold; }
    .note{ font-size:11.5px; fill:#6e7781; }
  </style>
  <rect width="1300" height="640" fill="#ffffff"/>

  <!-- ===================== Netze ===================== -->
  <!-- +5V Schiene -->
  <path class="p5" d="M140 250 H170 V100 H220"/>
  <path class="p5" d="M280 100 H340"/>
  <path class="p5" d="M400 100 H1090 V230 H1110"/>
  <path class="p5" d="M470 100 V262"/>
  <path class="p5" d="M530 100 V260 H560"/>
  <path class="p5" d="M890 100 V200"/>
  <!-- GND Schiene -->
  <path class="gnd" d="M140 310 H170 V480 H1090 V370 H1110"/>
  <path class="gnd" d="M470 292 V480"/>
  <path class="gnd" d="M560 370 H530 V480"/>
  <path class="gnd" d="M820 350 H790 V480"/>
  <path class="gnd" d="M890 400 V480"/>
  <!-- Daten -->
  <path class="sig" d="M720 290 H820"/>
  <path class="sig" d="M960 290 H990"/>
  <path class="sig" d="M1070 290 H1110"/>

  <!-- Knotenpunkte -->
  <g fill="#c0392b"><circle cx="470" cy="100" r="4.5"/><circle cx="530" cy="100" r="4.5"/><circle cx="890" cy="100" r="4.5"/></g>
  <g fill="#2563b0"><circle cx="470" cy="480" r="4.5"/><circle cx="530" cy="480" r="4.5"/><circle cx="790" cy="480" r="4.5"/><circle cx="890" cy="480" r="4.5"/></g>

  <!-- Netznamen -->
  <text class="net" x="640" y="88" fill="#c0392b" text-anchor="middle">+5 V</text>
  <text class="net" x="640" y="502" fill="#2563b0" text-anchor="middle">GND</text>
  <text class="note" x="770" y="282" text-anchor="middle" fill="#e67e22">DATA 3,3 V</text>
  <text class="note" x="1030" y="340" text-anchor="middle" fill="#e67e22">DATA 5 V</text>

  <!-- ===================== J1 Netzteil ===================== -->
  <rect class="part" x="40" y="225" width="100" height="110" rx="4"/>
  <text class="pin" x="126" y="255" text-anchor="end">+</text>
  <text class="pin" x="126" y="315" text-anchor="end">−</text>
  <text class="pin" x="60" y="285">DC in</text>
  <text class="ref" x="40" y="215">J1</text>
  <text class="val" x="40" y="356">Netzteil 5 V DC</text>
  <text class="val" x="40" y="373">Mean Well</text>
  <text class="val" x="40" y="390">GST60A05-P1J</text>

  <!-- ===================== F1 Sicherung ===================== -->
  <rect class="part" x="220" y="90" width="60" height="20"/>
  <line class="ln" x1="220" y1="100" x2="280" y2="100"/>
  <text class="ref" x="250" y="70" text-anchor="middle">F1</text>
  <text class="val" x="250" y="135" text-anchor="middle">10 A träge</text>

  <!-- ===================== S1 Schalter ===================== -->
  <circle cx="344" cy="100" r="4.5" fill="#fff" stroke="#1f2328" stroke-width="2"/>
  <circle cx="396" cy="100" r="4.5" fill="#fff" stroke="#1f2328" stroke-width="2"/>
  <line class="ln" x1="347" y1="97" x2="392" y2="76"/>
  <text class="ref" x="370" y="60" text-anchor="middle">S1</text>
  <text class="val" x="370" y="135" text-anchor="middle">Ein/Aus</text>

  <!-- ===================== C1 Elko ===================== -->
  <line class="ln" x1="450" y1="262" x2="490" y2="262"/>
  <path class="ln" d="M450 296 Q470 284 490 296"/>
  <text class="val" x="446" y="255" text-anchor="end">+</text>
  <text class="ref" x="500" y="270">C1</text>
  <text class="val" x="500" y="288">1000 µF</text>
  <text class="val" x="500" y="304">≥ 6,3 V</text>

  <!-- ===================== U1 Wemos D1 mini ===================== -->
  <rect class="part" x="560" y="225" width="160" height="175" rx="4"/>
  <text class="pin" x="568" y="265">5V</text>
  <text class="pin" x="568" y="375">G</text>
  <text class="pin" x="712" y="295" text-anchor="end">RX</text>
  <text class="pnr" x="712" y="310" text-anchor="end">GPIO3</text>
  <text class="ref" x="640" y="215" text-anchor="middle">U1</text>
  <text class="val" x="640" y="335" text-anchor="middle">Wemos D1 mini</text>
  <text class="val" x="640" y="352" text-anchor="middle">(ESP8266)</text>

  <!-- ===================== U2 74HCT125 ===================== -->
  <rect class="part" x="820" y="200" width="140" height="200" rx="4"/>
  <text class="pin" x="890" y="220" text-anchor="middle">VCC</text>
  <text class="pnr" x="896" y="192">14</text>
  <text class="pin" x="828" y="295">1A</text>
  <text class="pnr" x="808" y="284">2</text>
  <text class="pin" x="828" y="355">1OE</text><line x1="836" y1="340" x2="854" y2="340" stroke="#1f2328" stroke-width="1.2"/>
  <text class="pnr" x="808" y="344">1</text>
  <text class="pin" x="952" y="295" text-anchor="end">1Y</text>
  <text class="pnr" x="966" y="284">3</text>
  <text class="pin" x="890" y="392" text-anchor="middle">GND</text>
  <text class="pnr" x="896" y="418">7</text>
  <text class="ref" x="975" y="215">U2</text>
  <text class="val" x="890" y="250" text-anchor="middle">74HCT125</text>
  <text class="pnr" x="890" y="266" text-anchor="middle">Level Shifter 3,3 → 5 V</text>
  <text class="note" x="905" y="430">nicht genutzt: Gatter 2–4</text>
  <text class="note" x="905" y="445">(Pins 4–6, 8–13)</text>

  <!-- ===================== R1 ===================== -->
  <polyline class="ln" points="990,290 997,280 1010,300 1023,280 1036,300 1049,280 1062,300 1070,290"/>
  <text class="ref" x="1030" y="262" text-anchor="middle">R1</text>
  <text class="val" x="1030" y="322" text-anchor="middle">220 Ω</text>

  <!-- ===================== LED-Streifen ===================== -->
  <rect class="part" x="1110" y="200" width="150" height="200" rx="4"/>
  <text class="pin" x="1118" y="235">+5V</text>
  <text class="pin" x="1118" y="295">DIN</text>
  <text class="pin" x="1118" y="375">GND</text>
  <text class="ref" x="1185" y="190" text-anchor="middle">LED1 … LEDn</text>
  <g stroke="#1f2328" stroke-width="1.5" fill="#fff">
    <rect x="1170" y="320" width="16" height="16"/><rect x="1196" y="320" width="16" height="16"/><rect x="1222" y="320" width="16" height="16"/>
  </g>
  <g fill="#1f2328"><circle cx="1178" cy="328" r="3"/><circle cx="1204" cy="328" r="3"/><circle cx="1230" cy="328" r="3"/></g>
  <path stroke="#1f2328" stroke-width="1.2" fill="none" d="M1186 328 H1196 M1212 328 H1222 M1238 328 H1250" marker-end="url(#arr)"/>
  <text class="val" x="1210" y="358" text-anchor="middle">LED-Streifen</text>
  <text class="pnr" x="1210" y="374" text-anchor="middle">adressierbar, 5 V</text>
  <defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#1f2328"/></marker></defs>

  <!-- ===================== Legende + Schriftfeld ===================== -->
  <g transform="translate(40,560)">
    <line x1="0" y1="0" x2="28" y2="0" class="p5"/><text class="val" x="36" y="5">+5 V</text>
    <line x1="100" y1="0" x2="128" y2="0" class="gnd"/><text class="val" x="136" y="5">GND</text>
    <line x1="200" y1="0" x2="228" y2="0" class="sig"/><text class="val" x="236" y="5">Daten</text>
  </g>
  <g transform="translate(900,530)">
    <rect x="0" y="0" width="360" height="80" fill="#fff" stroke="#1f2328" stroke-width="1.5"/>
    <line x1="0" y1="34" x2="360" y2="34" stroke="#1f2328" stroke-width="1"/>
    <line x1="240" y1="34" x2="240" y2="80" stroke="#1f2328" stroke-width="1"/>
    <text x="12" y="24" font-size="17" font-weight="bold" fill="#1f2328">Wortuhr – Schaltplan</text>
    <text class="val" x="12" y="54">Autor: Julian Mündelein</text>
    <text class="val" x="12" y="71">Stand: 07.10.2026</text>
    <text class="val" x="252" y="54">Rev. 1.0</text>
    <text class="val" x="252" y="71">Blatt 1/1</text>
  </g>
</svg>
